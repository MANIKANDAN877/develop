version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: paypal-fraud-db
    environment:
      POSTGRES_DB: paypal_fraud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paypal_fraud"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
